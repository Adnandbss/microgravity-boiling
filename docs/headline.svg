<text x="742" y="236" font-size="13" letter-spacing=".2em" fill="#7A766E">WHAT THE FITS SAY</text>
<text x="742" y="282" font-size="15" fill="#4A4740">power law in g, 3 constants</text>
<text x="742" y="322" font-size="34" font-weight="700" fill="#141414">16.6 %</text>
<text x="742" y="346" font-size="13" fill="#7A766E">rms miss · above the ±10 % noise</text>
<text x="742" y="392" font-size="15" fill="#4A4740">g + n4·gen·γ and P, 5 constants</text>
<text x="742" y="432" font-size="34" font-weight="700" fill="#141414">12.3 %</text>
<text x="742" y="456" font-size="13" fill="#7A766E">rms miss · 14.1 % on 15 held-out points</text>
<text x="742" y="502" font-size="15" fill="#4A4740">Marangoni term at γ = 1.79</text>
<text x="742" y="542" font-size="34" font-weight="700" fill="#141414">23.7 m/s²</text>
<text x="742" y="566" font-size="13" fill="#7A766E">≈ 2.4 g of extra gravity</text>
</svg>
