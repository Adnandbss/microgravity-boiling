<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="t d" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">
<title id="t">Microgravity boiling — gravity drops 100 times, heat flux does not</title>
<desc id="d">Nucleate boiling of a water/2-propanol mixture measured on NASA parabolic flights. At 40 degrees C of wall superheat and 5.5 kPa, each gravity group's own power-law fit gives 88.7 W/cm2 at 0.098 m/s2, 90.0 at 9.8 and 133.2 at 19.6. A five-constant law fitted with a genetic algorithm, q = n1 (Tw-Tsat)^n2 (g + n4 gen gamma)^n3 P^n5, treats the Marangoni flow as an extra gravity of 23.7 m/s2 for gamma = 1.79. Without that term the same law would make the heat flux collapse at low gravity. The three-constant power law misses the data by 16.6 percent rms, the five-constant law by 12.3 percent (14.1 percent on 15 held-out points).</desc>
<rect width="1200" height="620" fill="#F5F3EE"/>

<!-- headline -->
<text x="56" y="64" font-size="14" letter-spacing=".2em" fill="#7A766E">NUCLEATE BOILING · WATER/2-PROPANOL · PARABOLIC FLIGHTS</text>
<text x="56" y="116" font-size="44" font-weight="700" fill="#141414">Gravity drops 100×. Heat flux doesn't.</text>
<text x="56" y="154" font-size="19" fill="#4A4740">Marangoni flow pulls liquid back to the hot wall. A genetic algorithm</text>
<text x="56" y="180" font-size="19" fill="#4A4740">fitted on 77 flight points reads it as 2.4 g of extra gravity.</text>

